<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid4" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.035"/>
    </pattern>
    <radialGradient id="maskGrad4" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <mask id="fadeMask4">
      <rect width="800" height="420" fill="url(#maskGrad4)"/>
    </mask>
    <filter id="blobBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="800" height="420" rx="14" fill="#08080c"/>

  <!-- ===== background depth blobs ===== -->
  <circle cx="120" cy="90" r="95" fill="#6366f1" opacity="0.10" filter="url(#blobBlur)">
    <animate attributeName="cx" values="120;150;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="360" r="110" fill="#8b5cf6" opacity="0.10" filter="url(#blobBlur)">
    <animate attributeName="cx" values="700;665;700" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="70" r="70" fill="#818cf8" opacity="0.08" filter="url(#blobBlur)">
    <animate attributeName="cy" values="70;100;70" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="380" r="80" fill="#a78bfa" opacity="0.08" filter="url(#blobBlur)">
    <animate attributeName="cy" values="380;350;380" dur="11s" repeatCount="indefinite"/>
  </circle>

  <rect width="800" height="420" rx="14" fill="url(#grid4)" mask="url(#fadeMask4)"/>
  <rect x="0.75" y="0.75" width="798.5" height="418.5" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- header tag -->
  <g transform="translate(48,44)">
    <rect x="-4" y="-12" width="8" height="8" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.7"/>
    <text x="16" y="-5" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" letter-spacing="1.5" fill="#94a3b8">TECH STACK</text>
  </g>

  <!-- corner ticks -->
  <path d="M 48 32 L 48 24 L 56 24" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.5"/>
  <path d="M 752 388 L 752 396 L 744 396" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== spokes with flowing pulse ===== -->
  <line x1="440" y1="235" x2="570" y2="235" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="440" cy="235" r="2.5" fill="#818cf8">
    <animateMotion path="M 0 0 L 130 0" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <line x1="420" y1="270" x2="485" y2="382" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="420" cy="270" r="2.5" fill="#818cf8">
    <animateMotion path="M 0 0 L 65 112" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <line x1="380" y1="270" x2="315" y2="382" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="380" cy="270" r="2.5" fill="#818cf8">
    <animateMotion path="M 0 0 L -65 112" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <line x1="360" y1="235" x2="230" y2="235" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="360" cy="235" r="2.5" fill="#818cf8">
    <animateMotion path="M 0 0 L -130 0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <line x1="380" y1="200" x2="315" y2="88" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="380" cy="200" r="2.5" fill="#818cf8">
    <animateMotion path="M 0 0 L -65 -112" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <line x1="420" y1="200" x2="485" y2="88" stroke="#818cf8" stroke-width="1" opacity="0.15"/>
  <circle cx="420" cy="200" r="2.5" fill="#818cf8">
    <animateMotion path="M 0 0 L 65 -112" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.4s" begin="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== fixed nodes, gentle breathing float, correctly anchored text ===== -->
  <!-- NOTE: additive="sum" removed — that was the bug causing nodes to render off-canvas -->

  <!-- Java — right, anchor start -->
  <g transform="translate(570,235)">
    <animateTransform attributeName="transform" type="translate" values="570,235;570,231;570,235" dur="3.2s" repeatCount="indefinite"/>
    <circle r="4" fill="#0f0f16" stroke="#818cf8" stroke-width="1.4"/>
    <text x="14" y="4" text-anchor="start" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#e2e8f0">Java</text>
  </g>

  <!-- Rust — down-right, anchor start -->
  <g transform="translate(485,382)">
    <animateTransform attributeName="transform" type="translate" values="485,382;485,378;485,382" dur="3.6s" begin="0.3s" repeatCount="indefinite"/>
    <circle r="4" fill="#0f0f16" stroke="#818cf8" stroke-width="1.4"/>
    <text x="12" y="5" text-anchor="start" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#e2e8f0">Rust</text>
  </g>

  <!-- Python — down-left, anchor end -->
  <g transform="translate(315,382)">
    <animateTransform attributeName="transform" type="translate" values="315,382;315,378;315,382" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    <circle r="4" fill="#0f0f16" stroke="#818cf8" stroke-width="1.4"/>
    <text x="-12" y="5" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#e2e8f0">Python</text>
  </g>

  <!-- Solana — left, anchor end -->
  <g transform="translate(230,235)">
    <animateTransform attributeName="transform" type="translate" values="230,235;230,231;230,235" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
    <circle r="4" fill="#0f0f16" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="-14" y="4" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#cbd5e1">Solana</text>
  </g>

  <!-- TypeScript — up-left, anchor end -->
  <g transform="translate(315,88)">
    <animateTransform attributeName="transform" type="translate" values="315,88;315,84;315,88" dur="3.3s" begin="1.2s" repeatCount="indefinite"/>
    <circle r="4" fill="#0f0f16" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="-12" y="4" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#cbd5e1">TypeScript</text>
  </g>

  <!-- LangChain — up-right, anchor start -->
  <g transform="translate(485,88)">
    <animateTransform attributeName="transform" type="translate" values="485,88;485,84;485,88" dur="3.7s" begin="1.5s" repeatCount="indefinite"/>
    <circle r="4" fill="#0f0f16" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="12" y="4" text-anchor="start" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#cbd5e1">LangChain</text>
  </g>

  <!-- ===== center hub ===== -->
  <circle cx="400" cy="235" r="52" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.35">
    <animate attributeName="r" values="52;58;52" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.1;0.35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="235" r="40" fill="#0f0f16" stroke="#818cf8" stroke-width="1.5"/>
  <text x="400" y="231" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="1">AR</text>
  <text x="400" y="246" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="7" fill="#818cf8" letter-spacing="1.5">WEB3+AI</text>

  <!-- footer caption -->
  <text x="400" y="404" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#475569" letter-spacing="1">CORE STACK · UPDATED CONTINUOUSLY</text>
</svg>
