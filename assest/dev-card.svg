<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid6" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.045"/>
    </pattern>
    <radialGradient id="maskGrad6" cx="15%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#333333"/>
    </radialGradient>
    <mask id="fadeMask6">
      <rect width="800" height="320" fill="url(#maskGrad6)"/>
    </mask>
    <filter id="blobBlur3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="pillGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base: dark, slightly brighter than before -->
  <rect width="800" height="320" rx="14" fill="#0e0e15"/>

  <!-- background depth blobs, slightly more visible -->
  <circle cx="90" cy="270" r="90" fill="#6366f1" opacity="0.13" filter="url(#blobBlur3)">
    <animate attributeName="cx" values="90;120;90" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="100" fill="#8b5cf6" opacity="0.13" filter="url(#blobBlur3)">
    <animate attributeName="cy" values="60;90;60" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="260" r="70" fill="#818cf8" opacity="0.10" filter="url(#blobBlur3)">
    <animate attributeName="cx" values="740;710;740" dur="9s" repeatCount="indefinite"/>
  </circle>

  <rect width="800" height="320" rx="14" fill="url(#grid6)" mask="url(#fadeMask6)"/>

  <!-- hairline border, slightly brighter -->
  <rect x="0.75" y="0.75" width="798.5" height="318.5" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- scanning border accent -->
  <rect x="0.75" y="0.75" width="798.5" height="318.5" rx="13.5" fill="none" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="60 2200">
    <animate attributeName="stroke-dashoffset" values="0;-2260" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- watermark glyph -->
  <text x="640" y="250" font-family="'JetBrains Mono','Fira Code',monospace" font-size="180" font-weight="700" fill="#ffffff" opacity="0.03">&lt;/&gt;</text>

  <!-- shimmer sweep -->
  <rect width="800" height="320" fill="url(#shimmer3)">
    <animateTransform attributeName="transform" type="translate" values="-800 0; 800 0; 800 0" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- status pill -->
  <g transform="translate(48,44)">
    <circle cx="6" cy="0" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="4" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" letter-spacing="1.5" fill="#a1acc2">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- activity sparkline -->
  <g transform="translate(620,32)">
    <text x="0" y="-6" font-family="'JetBrains Mono','Fira Code',monospace" font-size="9" letter-spacing="1.5" fill="#7c8aa5">ACTIVITY</text>
    <g fill="#818cf8">
      <rect x="0"  y="18" width="7" height="10" rx="1.5"><animate attributeName="height" values="10;22;10" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="18;6;18" dur="2.4s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="11" y="14" width="7" height="14" rx="1.5" opacity="0.85"><animate attributeName="height" values="14;24;14" dur="2.4s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="14;4;14" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="22" y="10" width="7" height="18" rx="1.5" opacity="0.7"><animate attributeName="height" values="18;26;18" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="10;2;10" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="33" y="16" width="7" height="12" rx="1.5" opacity="0.85"><animate attributeName="height" values="12;22;12" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="16;6;16" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="44" y="8"  width="7" height="20" rx="1.5"><animate attributeName="height" values="20;28;20" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="8;0;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="55" y="18" width="7" height="10" rx="1.5" opacity="0.7"><animate attributeName="height" values="10;20;10" dur="2.4s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="18;8;18" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></rect>
      <rect x="66" y="12" width="7" height="16" rx="1.5" opacity="0.85"><animate attributeName="height" values="16;25;16" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="12;3;12" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- name -->
  <text x="48" y="145" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="700" fill="#fbfbfe" letter-spacing="-1">Abhinav Rai</text>

  <!-- underline draw -->
  <rect x="49" y="162" height="2" rx="1" fill="url(#accentLine3)">
    <animate attributeName="width" values="0;220;220;0" keyTimes="0;0.3;0.8;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- role -->
  <text x="48" y="196" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#b4bdfa" letter-spacing="0.5">Software Engineer | Web3 + AI Dev</text>
  <text x="48" y="218" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#7c8aa5">Building production-grade applications with Java, Rust, Solana, and AI</text>

  <!-- divider -->
  <line x1="48" y1="242" x2="752" y2="242" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <!-- ===== eye-catching color-coded stack pills ===== -->
  <!-- Java -->
  <g transform="translate(48,256)" filter="url(#pillGlow)">
    <rect width="64" height="26" rx="13" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#818cf8"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
    <text x="25" y="17" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" fill="#c7d2fe">Java</text>
  </g>

  <!-- Rust -->
  <g transform="translate(124,256)" filter="url(#pillGlow)">
    <rect width="64" height="26" rx="13" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#34d399"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <text x="25" y="17" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" fill="#a7f3d0">Rust</text>
  </g>

  <!-- Python -->
  <g transform="translate(200,256)" filter="url(#pillGlow)">
    <rect width="80" height="26" rx="13" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#fbbf24"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="25" y="17" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" fill="#fde68a">Python</text>
  </g>

  <!-- Solana -->
  <g transform="translate(292,256)" filter="url(#pillGlow)">
    <rect width="80" height="26" rx="13" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text x="25" y="17" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" fill="#a5f3fc">Solana</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(384,256)" filter="url(#pillGlow)">
    <rect width="110" height="26" rx="13" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="25" y="17" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" fill="#bae6fd">TypeScript</text>
  </g>

  <!-- LangChain -->
  <g transform="translate(506,256)" filter="url(#pillGlow)">
    <rect width="100" height="26" rx="13" fill="#c084fc" fill-opacity="0.10" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#c084fc"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" begin="1.0s" repeatCount="indefinite"/></circle>
    <text x="25" y="17" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" fill="#e9d5ff">LangChain</text>
  </g>

  <!-- corner ticks -->
  <path d="M 48 32 L 48 24 L 56 24" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.6"/>
  <path d="M 752 288 L 752 296 L 744 296" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.6"/>
</svg>
